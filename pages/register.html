<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="إنشاء حساب في منصة Cyber Challenge">

    <title>إنشاء حساب | Cyber Challenge</title>
</head>

<body>

    <!-- Header -->
    <header>
        <a href="../index.html">
            <h1>🛡️ Cyber Challenge</h1>
        </a>
    </header>

    <!-- Main Content -->
    <main>

        <section aria-labelledby="register-title">

            <h2 id="register-title">إنشاء حساب | Register</h2>

            <form action="#" method="post">

                <!-- Full Name -->
                <div>
                    <label for="full-name">
                        الاسم الكامل
                    </label>

                    <br>

                    <input
                        type="text"
                        id="full-name"
                        name="full_name"
                        autocomplete="name"
                        placeholder="أدخل اسمك الكامل"
                        required>
                </div>

                <br>

                <!-- Email -->
                <div>
                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <br>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="أدخل بريدك الإلكتروني"
                        required>
                </div>

                <br>

                <!-- Password -->
                <div>
                    <label for="password">
                        كلمة المرور
                    </label>

                    <br>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="8 أحرف على الأقل"
                        required>
                </div>

                <br>

                <!-- Confirm Password -->
                <div>
                    <label for="confirm-password">
                        تأكيد كلمة المرور
                    </label>

                    <br>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="أعد إدخال كلمة المرور"
                        required>
                </div>

                <br>

                <!-- Terms -->
                <div>
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        value="accepted"
                        required>

                    <label for="terms">
                        أوافق على شروط الاستخدام
                    </label>
                </div>

                <br>

                <!-- Submit -->
                <button type="submit">
                    إنشاء الحساب
                </button>

            </form>

            <p>
                لديك حساب بالفعل؟
                <a href="login.html">تسجيل الدخول</a>
            </p>

            <p>
                <a href="../index.html">العودة إلى الرئيسية</a>
            </p>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Cyber Challenge</p>
    </footer>

</body>

</html>
