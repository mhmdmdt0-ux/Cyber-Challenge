
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تغيير كلمة المرور في Cyber Challenge">

    <title>تغيير كلمة المرور | Cyber Challenge</title>
</head>

<body>

    <header>
        <a href="../index.html">
            <h1>🛡️ Cyber Challenge</h1>
        </a>
    </header>

    <main>
        <section aria-labelledby="page-title">

            <h2 id="page-title">تغيير كلمة المرور</h2>

            <form action="#" method="post">

                <div>
                    <label for="current-password">كلمة المرور الحالية</label>
                    <br>
                    <input
                        type="password"
                        id="current-password"
                        name="current_password"
                        autocomplete="current-password"
                        required>
                </div>

                <br>

                <div>
                    <label for="new-password">كلمة المرور الجديدة</label>
                    <br>
                    <input
                        type="password"
                        id="new-password"
                        name="new_password"
                        autocomplete="new-password"
                        minlength="8"
                        required>
                </div>

                <br>

                <div>
                    <label for="confirm-password">تأكيد كلمة المرور الجديدة</label>
                    <br>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        autocomplete="new-password"
                        minlength="8"
                        required>
                </div>

                <br>

                <button type="submit">تغيير كلمة المرور</button>

            </form>

            <p>
                <a href="profile.html">العودة إلى الملف الشخصي</a>
            </p>

            <p>
                <a href="dashboard.html">العودة إلى لوحة التحكم</a>
            </p>

        </section>
    </main>

    <footer>
        <p>© 2026 Cyber Challenge</p>
    </footer>

</body>

</html>
