
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="استعادة كلمة المرور في Cyber Challenge">

    <title>استعادة كلمة المرور | Cyber Challenge</title>
</head>

<body>

    <header>
        <a href="../index.html">
            <h1>🛡️ Cyber Challenge</h1>
        </a>
    </header>

    <main>
        <section aria-labelledby="page-title">

            <h2 id="page-title">استعادة كلمة المرور</h2>

            <p>
                أدخل بريدك الإلكتروني لطلب استعادة كلمة المرور.
            </p>

            <form action="#" method="post">

                <div>
                    <label for="email">البريد الإلكتروني</label>
                    <br>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="أدخل بريدك الإلكتروني"
                        required>
                </div>

                <br>

                <button type="submit">
                    طلب استعادة كلمة المرور
                </button>

            </form>

            <p>
                <a href="login.html">العودة إلى تسجيل الدخول</a>
            </p>

            <p>
                <a href="../index.html">العودة إلى الرئيسية</a>
            </p>

        </section>
    </main>

    <footer>
        <p>© 2026 Cyber Challenge</p>
    </footer>

</body>

</html>
