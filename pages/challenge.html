
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تحدي تفاعلي في الأمن السيبراني">

    <title>تنفيذ التحدي | Cyber Challenge</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header>
        <a href="../index.html">
            <h1>🛡️ Cyber Challenge</h1>
        </a>

        <nav aria-label="التنقل الرئيسي">
            <a href="../index.html">الرئيسية</a>
            |
            <a href="challenges.html">التحديات</a>
            |
            <a href="dashboard.html">لوحة التحكم</a>
        </nav>
    </header>

    <main>
        <section aria-labelledby="challenge-title">

            <h2 id="challenge-title">🔐 تحدي أمن كلمات المرور</h2>

            <p>
                اختر الإجابة الصحيحة لكل سؤال، ثم اضغط على إرسال الإجابات.
            </p>

            <form action="result.html" method="get">

                <fieldset>
                    <legend>السؤال الأول: أي كلمة مرور أقوى؟</legend>

                    <label>
                        <input type="radio" name="q1" value="a" required>
                        12345678
                    </label>
                    <br>

                    <label>
                        <input type="radio" name="q1" value="b">
                        password
                    </label>
                    <br>

                    <label>
                        <input type="radio" name="q1" value="c">
                        T9#mQ2!vL7@x
                    </label>
                </fieldset>

                <br>

                <fieldset>
                    <legend>السؤال الثاني: ماذا تفعل إذا وصلك رابط مشبوه؟</legend>

                    <label>
                        <input type="radio" name="q2" value="a" required>
                        أفتحه مباشرةً
                    </label>
                    <br>

                    <label>
                        <input type="radio" name="q2" value="b">
                        أتحقق من المرسل والرابط قبل فتحه
                    </label>
                    <br>

                    <label>
                        <input type="radio" name="q2" value="c">
                        أرسل بياناتي عبر الرابط
                    </label>
                </fieldset>

                <br>

                <fieldset>
                    <legend>السؤال الثالث: ما فائدة الجدار الناري (Firewall)؟</legend>

                    <label>
                        <input type="radio" name="q3" value="a" required>
                        تنظيم ومراقبة حركة مرور الشبكة وفق قواعد محددة
                    </label>
                    <br>

                    <label>
                        <input type="radio" name="q3" value="b">
                        زيادة مساحة القرص
                    </label>
                    <br>

                    <label>
                        <input type="radio" name="q3" value="c">
                        إنشاء كلمات المرور تلقائيًا دائمًا
                    </label>
                </fieldset>

                <br>

                <button type="submit">إرسال الإجابات</button>

            </form>

        </section>
    </main>

    <footer>
        <p>© 2026 Cyber Challenge</p>
    </footer>

</body>

</html>
