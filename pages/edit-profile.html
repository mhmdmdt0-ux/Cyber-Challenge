
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تعديل بيانات الملف الشخصي في Cyber Challenge">

    <title>تعديل الملف الشخصي | Cyber Challenge</title>
</head>

<body>

    <header>
        <a href="../index.html">
            <h1>🛡️ Cyber Challenge</h1>
        </a>
    </header>

    <main>
        <section aria-labelledby="page-title">

            <h2 id="page-title">تعديل الملف الشخصي</h2>

            <form action="#" method="post">

                <div>
                    <label for="full-name">الاسم الكامل</label>
                    <br>
                    <input
                        type="text"
                        id="full-name"
                        name="full_name"
                        autocomplete="name"
                        placeholder="أدخل اسمك الكامل"
                        required>
                </div>

                <br>

                <div>
                    <label for="email">البريد الإلكتروني</label>
                    <br>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="أدخل بريدك الإلكتروني"
                        required>
                </div>

                <br>

                <button type="submit">حفظ التعديلات</button>

            </form>

            <p>
                <a href="profile.html">العودة إلى الملف الشخصي</a>
            </p>

            <p>
                <a href="dashboard.html">العودة إلى لوحة التحكم</a>
            </p>

        </section>
    </main>

    <footer>
        <p>© 2026 Cyber Challenge</p>
    </footer>

</body>

</html>
