<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="تسجيل الدخول إلى منصة Cyber Challenge">

    <title>تسجيل الدخول | Cyber Challenge</title>
</head>

<body>

    <!-- Header -->
    <header>
        <a href="../index.html">
            <h1>🛡️ Cyber Challenge</h1>
        </a>
    </header>

    <!-- Main Content -->
    <main>

        <section aria-labelledby="login-title">

            <h2 id="login-title">تسجيل الدخول | Login</h2>

            <form action="#" method="post">

                <!-- Email -->
                <div>
                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <br>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="أدخل بريدك الإلكتروني"
                        autocomplete="email"
                        required>
                </div>

                <br>

                <!-- Password -->
                <div>
                    <label for="password">
                        كلمة المرور
                    </label>

                    <br>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required>
                </div>

                <br>

                <!-- Remember Me -->
                <div>
                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                        value="1">

                    <label for="remember">
                        تذكرني
                    </label>
                </div>

                <br>

                <!-- Forgot Password -->
                <div>
                    <a href="forgot-password.html">
                        نسيت كلمة المرور؟
                    </a>
                </div>

                <br>

                <!-- Submit -->
                <button type="submit">
                    تسجيل الدخول
                </button>

            </form>

            <!-- Register -->
            <p>
                ليس لديك حساب؟
                <a href="register.html">إنشاء حساب</a>
            </p>

            <!-- Back Home -->
            <p>
                <a href="../index.html">
                    العودة إلى الرئيسية
                </a>
            </p>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Cyber Challenge</p>
    </footer>

</body>

</html>
